name: 部署 Hugo 站点到 GitHub Pages

on:
  push:
    branches: ["master"]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# gh-pages 分支发布需要写分支的权限
permissions:
  contents: write

# 同时只允许一次构建，排队中的稍后跑，避免互相覆盖
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 需要完整历史，Hugo 要用 .GitInfo 取最后更新时间
          fetch-depth: 0

      - name: 安装 Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: 构建站点
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          # 先清空 public：避免上一次构建的残留文件被一起发布
          rm -rf public
          hugo --gc --minify --baseURL "https://summdy.github.io/"

      - name: 生成 Pagefind 搜索索引
        # 版本与本地一致，避免 CI 拉到不兼容的新版
        run: npx -y pagefind@1.5.2 --site public --output-subdir pagefind

      - name: 校验构建产物
        # 之前踩过的坑：Pages 源还是分支 + Jekyll 时，Hugo 产物一个都没上线，
        # 首页是 README 渲染出来的，/search/ 等页面全 404。这里提前把关键产物卡住。
        run: |
          set -e
          missing=0
          check() {
            if [ -f "$1" ]; then
              echo "OK   $1"
            else
              echo "::error::$1 缺失 —— $2"
              missing=1
            fi
          }
          check public/index.html "站点未成功构建"
          check public/search/index.html "搜索页未生成"
          check public/search/index.json "Fuse 回退数据源缺失，检查 content/search/index.md 的 outputs 是否含 json"
          check public/pagefind/pagefind-entry.json "Pagefind 索引未生成"
          if [ "$missing" -ne 0 ]; then
            echo "::error::构建产物不完整，终止部署"
            exit 1
          fi
          echo "构建产物校验通过"

      - name: 关闭 Jekyll
        # 不加这个，GitHub Pages 拿到 gh-pages 分支后会再跑一次 Jekyll，
        # 又会把 Hugo 产物当成静态文件重新处理甚至报错
        run: touch public/.nojekyll

      - name: 发布到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.sha }}"
